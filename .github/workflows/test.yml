name: Daily Retro Game Bot

on:
  workflow_dispatch:
  schedule:
    - cron: "00 19 * * *"

jobs:
  create-content:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install software
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng portaudio19-dev
          python -m pip install --upgrade pip
          pip install kokoro-tts

      - name: Download Kokoro voice model
        run: |
          wget -q https://github.com/nazdridoy/kokoro-tts/releases/download/v1.0.0/voices-v1.0.bin
          wget -q https://github.com/nazdridoy/kokoro-tts/releases/download/v1.0.0/kokoro-v1.0.onnx

      - name: Pick today's game
        run: python src/game_picker.py

      - name: Create today's script
        run: python src/script_generator.py

      - name: Create today's voice
        run: |
          kokoro-tts output/todays_script.txt output/todays_voice.wav --voice am_michael

      - name: Create today's video
        run: python src/video_generator.py

      - name: Check video
        run: |
          ls -lh output/
          test -f output/todays_video.mp4

      - name: Save today's video
        uses: actions/upload-artifact@v4
        with:
          name: retro-tiktok-video
          path: output/todays_video.mp4
          retention-days: 7

      - name: Save script
        uses: actions/upload-artifact@v4
        with:
          name: retro-tiktok-script
          path: output/todays_script.txt
          retention-days: 7
