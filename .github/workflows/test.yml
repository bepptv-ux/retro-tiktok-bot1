name: Daily Retro Game Bot

on:
  workflow_dispatch:
  schedule:
    - cron: "00 19 * * *"

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run game picker
        run: python src/game_picker.py
